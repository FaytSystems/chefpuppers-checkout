<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout Canceled | ChefPuppers.store</title>
  <meta name="description" content="ChefPuppers checkout was canceled." />
  <link rel="icon" href="/assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Lobster+Two:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="status-page">
    <section class="status-card">
      <img src="/assets/logo.png" alt="ChefPuppers logo" />
      <p class="eyebrow">Checkout Canceled</p>
      <h1>No worries.</h1>
      <p>
        Your payment was not completed. You can return to the store and start checkout again when ready.
      </p>
      <div class="status-actions">
        <a class="btn btn-primary" href="/">Return to Store</a>
        <a class="btn btn-secondary" href="/#shop">View Treats</a>
      </div>
    </section>
  </main>
</body>
</html>
